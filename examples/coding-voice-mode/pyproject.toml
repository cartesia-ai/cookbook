[project]
name = "cartesia-voice-mode"
version = "0.1.0"
description = "MCP server that adds voice mode to Claude Code, Cursor and Codex with Cartesia Sonic 3.6 text to speech and Ink 2 speech to text."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["cartesia", "mcp", "mcp-server", "voice-mode", "text-to-speech", "speech-to-text", "claude-code", "cursor", "codex", "coding-agent"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Software Development",
  "Environment :: Console",
]
dependencies = [
  "cartesia[websockets]>=4.2,<5",
  "fastmcp>=3.2,<4",
  "sounddevice>=0.5",
  "numpy>=1.26",
  "click>=8.1",
  "tomlkit>=0.13",
]

[project.urls]
Homepage = "https://github.com/cartesia-ai/cookbook/tree/main/examples/coding-voice-mode"
Repository = "https://github.com/cartesia-ai/cookbook"
Documentation = "https://docs.cartesia.ai"

[project.scripts]
cartesia-voice-mode = "cartesia_voice_mode.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cartesia_voice_mode"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
