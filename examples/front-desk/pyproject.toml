[project]
name = "front-desk"
version = "0.1.0"
description = "AI receptionist on a Cartesia Managed Agent: answers calls, books appointments, takes messages, and logs every call with transcript and latency."
readme = "README.md"
license = "Apache-2.0"
keywords = ["cartesia", "voice-agent", "managed-agents", "receptionist", "telephony", "appointment-booking", "fastapi", "text-to-speech", "speech-to-text"]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32",
  "jinja2>=3.1",
  "httpx>=0.28",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["front_desk"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "E501"]  # the formatter wraps code; long prompt strings stay readable

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict_optional = true
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
