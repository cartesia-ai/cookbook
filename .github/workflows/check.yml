name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm check (facts, content, snippets, catalog, copies, typecheck, test)
        run: pnpm check
      - name: Build every package with no env vars set
        run: pnpm build

  standalone:
    name: standalone (${{ matrix.template }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template:
          - article-to-podcast
          - docs-voice-widget
          - meeting-notes
          - pocket-interpreter
          - speaking-partner
          - story-time
          - voice-chat
          - voice-journal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          check-latest: true
      - name: Copy the template out of the workspace
        run: |
          mkdir -p "$RUNNER_TEMP/app"
          git archive HEAD "examples/${{ matrix.template }}" | tar -x -C "$RUNNER_TEMP/app" --strip-components=2
      - name: npm install
        working-directory: ${{ runner.temp }}/app
        run: npm install --no-audit --no-fund
      - name: npm run typecheck
        working-directory: ${{ runner.temp }}/app
        run: npm run typecheck --if-present
      - name: npm test
        working-directory: ${{ runner.temp }}/app
        run: npm test

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - template: front-desk
            lint: uv run ruff check . && uv run ruff format --check . && uv run mypy front_desk scripts
          - template: audiobook
            apt: ffmpeg
          - template: coding-voice-mode
            apt: libportaudio2
    defaults:
      run:
        working-directory: examples/${{ matrix.template }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.apt
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest
      - if: matrix.lint
        run: ${{ matrix.lint }}
